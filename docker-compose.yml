services:
  registration:
    build:
      context: ./Registration-Microservice
    container_name: registration-container
    ports:
      - "3001:3001"
    env_file:
      - ./Registration-Microservice/.env

  login:
    build:
      context: ./Login-Microservice
    container_name: login-container
    ports:
      - "3002:3002"
    env_file:
      - ./Login-Microservice/.env
    depends_on:
      - registration